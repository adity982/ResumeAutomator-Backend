name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app main.py
      - run: pytest --cov=app --cov-report=term-missing
      - run: alembic upgrade head
        env:
          APP_ENV: test
          AUTH_MODE: development
          DATABASE_URL: sqlite:///./migration-test.db
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: resume
          POSTGRES_PASSWORD: resume
          POSTGRES_DB: resume_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U resume -d resume_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      AUTH_MODE: development
      DATABASE_URL: postgresql+psycopg://resume:resume@localhost:5432/resume_test
      TEST_DATABASE_URL: postgresql+psycopg://resume:resume@localhost:5432/resume_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade 0002_market_features
      - run: alembic upgrade head
      - run: pytest -q
